name: Build Python desktop app

on:
  push:
    branches:
      - arena/01a0f772-codereo-ide
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-desktop-build-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: PySide6 app on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js for the local app service
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Python for the native desktop shell
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-desktop-build.txt

      - name: Install Linux Qt WebEngine libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y libasound2t64 libdbus-1-3 libegl1 libgbm1 libgl1 libnss3 libx11-xcb1 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libxcomposite1 libxcursor1 libxi6 libxkbcommon-x11-0 libxrandr2 libxss1

      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      - name: Build interface embedded in the desktop app
        run: npm run build

      - name: Keep only Node runtime dependencies
        run: npm ci --omit=dev --ignore-scripts

      - name: Install PySide6 and PyInstaller
        run: python -m pip install -r requirements-desktop-build.txt

      - name: Select the bundled Node runtime
        shell: bash
        run: |
          python - <<'PY'
          import os
          import subprocess
          node = subprocess.check_output(['node', '-p', 'process.execPath'], text=True).strip()
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env_file:
              env_file.write(f'CODERO_NODE_BINARY={node}\n')
          print(f'Bundling Node runtime: {node}')
          PY

      - name: Remove previous app bundle output
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          output = Path('dist')
          for candidate in output.glob('Codero-IDE*'):
              if candidate.is_dir():
                  shutil.rmtree(candidate)
              else:
                  candidate.unlink()
          PY

      - name: Package the native Python desktop app
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          import sys
          result = subprocess.run(
              [sys.executable, '-m', 'PyInstaller', '--clean', '--noconfirm', 'desktop/Codero-IDE.spec'],
              capture_output=True,
              text=True,
          )
          print(result.stdout, end='')
          print(result.stderr, end='', file=sys.stderr)
          if result.returncode:
              lines = (result.stdout + '\n' + result.stderr).splitlines()
              detail = ' | '.join(lines[-40:])[-8000:]
              print(f'::error title=PyInstaller::{detail}')
          raise SystemExit(result.returncode)
          PY

      - name: Verify packaged app and bundled Node runtime
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path
          try:
              bundle_name = 'Codero-IDE.app' if sys.platform == 'darwin' else 'Codero-IDE'
              bundle = Path('dist') / bundle_name
              if not bundle.exists():
                  raise RuntimeError(f'PyInstaller did not create the expected desktop bundle: {bundle}.')
              server_entry = next(bundle.rglob('server/index.mjs'), None)
              if server_entry is None:
                  raise RuntimeError(f'Packaged desktop app is missing its local server under {bundle}.')
              root = server_entry.parents[1]
              launcher_name = 'Codero-IDE.exe' if os.name == 'nt' else 'Codero-IDE'
              launcher = next((path for path in bundle.rglob(launcher_name) if path.is_file()), None)
              if launcher is None:
                  raise RuntimeError(f'Packaged desktop app is missing its native launcher under {bundle}.')
              required = [root / 'dist' / 'index.html', root / 'node_modules' / 'express' / 'package.json']
              for path in required:
                  if not path.is_file():
                      raise RuntimeError(f'Packaged desktop app is missing {path}; server entry is {server_entry}.')
              node = root / 'runtime' / ('node.exe' if os.name == 'nt' else 'node')
              if not node.is_file():
                  raise RuntimeError(f'Packaged desktop app is missing its bundled Node runtime at {node}.')
              node_result = subprocess.run([str(node), '--version'], capture_output=True, text=True)
              if node_result.returncode:
                  raise RuntimeError(f'Bundled Node runtime failed ({node_result.returncode}): {node_result.stderr[-2000:]}')
              helper_name = 'Codero-IDE-ChatImporter.exe' if os.name == 'nt' else 'Codero-IDE-ChatImporter'
              helper = next(bundle.rglob(helper_name), None)
              if helper is None:
                  raise RuntimeError(f'Packaged desktop app is missing its bundled chat importer under {bundle}.')
              parsed = subprocess.run([str(helper), 'smoke.json'], input=b'{"messages":[{"role":"user","content":"hello"}]}', capture_output=True)
              if parsed.returncode:
                  detail = parsed.stderr[-4000:].decode(errors='replace').replace('\r', '').replace('\n', ' | ')
                  raise RuntimeError(f'Bundled chat importer failed ({parsed.returncode}): {detail}')
              if json.loads(parsed.stdout)['turns'] != 1:
                  raise RuntimeError('Bundled chat importer produced an unexpected smoke-test result.')
              print(f'Validated native desktop bundle: {bundle}; resources: {root}')
          except BaseException as error:
              print(f'::error title=Packaged app verification::{type(error).__name__}: {error}')
              raise
          PY

      - name: Upload Python desktop app bundle
        uses: actions/upload-artifact@v7
        with:
          name: codero-ide-${{ runner.os }}-${{ runner.arch }}
          path: dist/Codero-IDE*
          if-no-files-found: error
          retention-days: 14
