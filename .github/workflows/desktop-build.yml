name: Build desktop installers

on:
  push:
    branches:
      - arena/01a0f772-codereo-ide
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-latest
          - macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build desktop installer
        run: npm run desktop:electron:package

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: codero-ide-${{ runner.os }}-${{ runner.arch }}
          path: release/*
          if-no-files-found: error
          retention-days: 14
